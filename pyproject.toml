[project]
name = "india-road-safety"
version = "0.1.0"
description = "Reproducible, human-reviewed analysis of Indian road-crash reports and road-surface hazards"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
  "pyarrow>=17,<25",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1,<4",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
  "nltk>=3.9,<4",
]

[project.optional-dependencies]
vision = ["torch>=2.4,<3", "torchvision>=0.19,<1", "Pillow>=10,<13", "tqdm>=4.66,<5"]
nlp = ["spacy>=3.8,<4", "transformers>=4.45,<6", "sentence-transformers>=3,<6"]
notebooks = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<7"]
dev = ["ruff>=0.8,<1", "pytest>=8.3,<9"]

[project.scripts]
road-safety = "road_safety.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road_safety"]

[tool.ruff]
line-length = 100
target-version = "py311"
